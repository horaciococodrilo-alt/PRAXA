version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Argentina/Buenos_Aires
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch
