name: Praxa implementation ticket
description: Ticket verificable para Company Brain v0
title: "[VS-XX] "
labels: ["planned"]
body:
  - type: input
    id: estimated_hours
    attributes:
      label: Estimación de horas humanas
      description: Rango estimado. El tiempo de ejecución autónomo de un agente no cuenta como hora humana.
      placeholder: "por ejemplo 20–30"
    validations:
      required: true
  - type: input
    id: actual_hours
    attributes:
      label: Horas humanas reales al cierre
      description: Completar al cerrar el ticket. Incluye revisión, corrección, QA, integración y decisiones.
      placeholder: "completar al cerrar"
    validations:
      required: false
  - type: input
    id: outcome
    attributes:
      label: Resultado observable
      description: ¿Qué podrá demostrarse cuando termine?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Incluye
    validations:
      required: true
  - type: textarea
    id: non_scope
    attributes:
      label: No incluye
    validations:
      required: true
  - type: textarea
    id: spec
    attributes:
      label: Especificación y ADRs relevantes
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Criterios de aceptación
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: Pruebas y verificación
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Riesgos, seguridad y tenancy
    validations:
      required: true
