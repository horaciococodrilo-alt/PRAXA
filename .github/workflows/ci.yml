name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci-required:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_ENV: ci
      POSTGRES_HOST_PORT: "5432"
      POSTGRES_SUPERUSER_PASSWORD: local-bootstrap-only
      DATABASE_URL: postgresql+psycopg://praxa_app:local-app-only@localhost:5432/praxa
      MIGRATION_DATABASE_URL: postgresql+psycopg://praxa_owner:local-owner-only@localhost:5432/praxa
      SEED_DATABASE_URL: postgresql+psycopg://postgres:local-bootstrap-only@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.17"
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make ci-full
