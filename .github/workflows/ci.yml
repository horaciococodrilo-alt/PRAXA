name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Solo se cancelan corridas de PR superadas por un push nuevo.
  # Las corridas de integracion en main nunca se cancelan.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Un unico job que invoca una sola vez el contrato canonico.
  #
  # El workflow solo prepara el entorno: checkout, uv/Python y Node. No levanta PostgreSQL por
  # su cuenta, no corre bootstrap ni migraciones aparte y no ejecuta ninguna suite fuera de
  # `make ci-full`. Si el contrato cambia, cambia en el Makefile y CI lo hereda sin editarse.
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Credenciales sinteticas del PostgreSQL efimero del runner. Viven y mueren con el job.
      POSTGRES_PASSWORD: ci-superuser
      PRAXA_OWNER_PASSWORD: ci-owner
      PRAXA_APP_PASSWORD: ci-app
      POSTGRES_HOST_PORT: "5432"
      # Tres credenciales, una por contexto, igual que en desarrollo.
      DATABASE_URL: postgresql+psycopg://praxa_app:ci-app@127.0.0.1:5432/praxa
      MIGRATION_DATABASE_URL: postgresql+psycopg://praxa_owner:ci-owner@127.0.0.1:5432/praxa
      SEED_DATABASE_URL: postgresql+psycopg://postgres:ci-superuser@127.0.0.1:5432/praxa
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.17"
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make ci-full
