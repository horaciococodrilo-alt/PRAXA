[project]
name = "praxa-backend"
version = "0.1.0"
description = "Praxa Company Brain v0 backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # ADR-014: SQLAlchemy 2 sincrono con psycopg 3. Sin asyncpg.
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    # binary evita necesitar toolchain de compilacion en Windows y en CI.
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.4,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx2>=2.9",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/praxa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requiere PostgreSQL real; nunca SQLite",
    "security: prueba adversarial de RLS, roles y contexto; requiere PostgreSQL real",
]

[tool.ruff]
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/praxa", "tests", "scripts", "migrations"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Alembic genera env.py y las revisiones sin anotaciones completas de sus propios hooks.
module = ["alembic.*"]
ignore_missing_imports = true
