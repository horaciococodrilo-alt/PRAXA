[project]
name = "praxa-backend"
version = "0.1.0"
description = "Praxa Company Brain v0 backend"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2",
    "fastapi>=0.115",
    "psycopg[binary]>=3.2,<4",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx2>=2.9",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/praxa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires PostgreSQL",
    "security: requires PostgreSQL and the praxa_app role",
]

[tool.ruff]
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["praxa"]
