; Alembic para Praxa.
;
; La URL no vive aca: la aporta migrations/env.py desde MIGRATION_DATABASE_URL, que es la
; credencial del rol owner. Ponerla en este archivo la versionaria.

[alembic]
script_location = migrations
prepend_sys_path = src
file_template = %%(rev)s_%%(slug)s
path_separator = os
